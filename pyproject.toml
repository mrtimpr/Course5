[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [".venv", "*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.coverage.run]
branch = true
source = ["users", "habits", "telegram_bot"]
omit = ["*/migrations/*", "*/admin.py", "*/apps.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80
